name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish built site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          enable_jekyll: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Point Pages at the built site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          hdr=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X PUT "${hdr[@]}" "$api" -d '{"build_type":"workflow"}')
          echo "build_type=workflow HTTP ${code}"
          cat /tmp/pages.json
          echo

          if [ "${code}" != "200" ] && [ "${code}" != "204" ]; then
            code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X PUT "${hdr[@]}" "$api" \
              -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}')
            echo "source=gh-pages HTTP ${code}"
            cat /tmp/pages.json
            echo
          fi
      - id: deployment
        uses: actions/deploy-pages@v4
